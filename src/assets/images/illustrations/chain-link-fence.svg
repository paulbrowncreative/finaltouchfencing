<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Illustration of a galvanized chain link fence along a backyard lawn</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc7ea"/>
      <stop offset="0.55" stop-color="#d6e9f6"/>
      <stop offset="1" stop-color="#eef5f0"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa65a"/>
      <stop offset="0.4" stop-color="#5f8c3d"/>
      <stop offset="1" stop-color="#3f6b27"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f777e"/>
      <stop offset="0.35" stop-color="#e3e7ea"/>
      <stop offset="0.6" stop-color="#b3bac0"/>
      <stop offset="1" stop-color="#5d646a"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#70787f"/>
      <stop offset="0.35" stop-color="#eef1f3"/>
      <stop offset="0.65" stop-color="#b6bdc3"/>
      <stop offset="1" stop-color="#5a6167"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <!-- woven chain link mesh: two zigzag wires per cell, highlight over shade for a galvanized look -->
    <pattern id="mesh" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M0 0 L28 28 L0 56 M56 0 L28 28 L56 56" fill="none" stroke="#4e555b" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M0 0 L28 28 L0 56 M56 0 L28 28 L56 56" fill="none" stroke="#c9cfd4" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M27 24 Q31 28 27 32" fill="none" stroke="#f4f6f7" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <pattern id="meshShadow" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M0 0 L28 28 L0 56 M56 0 L28 28 L56 56" fill="none" stroke="#2c4a1c" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- distant tree line and houses -->
  <g filter="url(#soft)" opacity="0.9">
    <ellipse cx="160" cy="560" rx="260" ry="120" fill="#5c7f4a"/>
    <ellipse cx="520" cy="540" rx="220" ry="140" fill="#4f7340"/>
    <ellipse cx="1180" cy="550" rx="300" ry="130" fill="#557a45"/>
    <ellipse cx="1520" cy="560" rx="220" ry="120" fill="#4b6d3d"/>
    <rect x="760" y="470" width="260" height="140" fill="#d9d2c4"/>
    <polygon points="740,480 890,400 1040,480" fill="#7b6f66"/>
  </g>
  <rect y="600" width="1600" height="400" fill="url(#lawn)"/>
  <!-- mown-lawn stripes -->
  <g opacity="0.12" fill="#ffffff">
    <rect y="660" width="1600" height="38"/><rect y="760" width="1600" height="52"/><rect y="890" width="1600" height="66"/>
  </g>

  <!-- shadow of the fence on the lawn -->
  <g transform="translate(0 610) skewX(-38) scale(1 0.32)">
    <rect x="0" y="0" width="2400" height="1000" fill="url(#meshShadow)"/>
  </g>

  <!-- mesh -->
  <rect x="0" y="250" width="1600" height="560" fill="url(#mesh)"/>
  <!-- knuckled (folded) bottom selvage -->
  <rect x="0" y="802" width="1600" height="10" fill="#7d858b" opacity="0.6"/>

  <!-- top rail -->
  <g filter="url(#shadow)" opacity="0.35"><rect x="0" y="252" width="1600" height="30" fill="#000"/></g>
  <rect x="0" y="236" width="1600" height="28" rx="14" fill="url(#rail)"/>

  <!-- posts with dome caps -->
  <g>
    <rect x="236" y="214" width="44" height="640" fill="url(#post)"/>
    <ellipse cx="258" cy="214" rx="28" ry="16" fill="#9aa2a8"/><ellipse cx="258" cy="210" rx="24" ry="11" fill="#d8dde1"/>
    <rect x="1036" y="214" width="44" height="640" fill="url(#post)"/>
    <ellipse cx="1058" cy="214" rx="28" ry="16" fill="#9aa2a8"/><ellipse cx="1058" cy="210" rx="24" ry="11" fill="#d8dde1"/>
    <g fill="#5a6167">
      <rect x="230" y="300" width="56" height="10" rx="3"/><rect x="230" y="500" width="56" height="10" rx="3"/><rect x="230" y="700" width="56" height="10" rx="3"/>
      <rect x="1030" y="300" width="56" height="10" rx="3"/><rect x="1030" y="500" width="56" height="10" rx="3"/><rect x="1030" y="700" width="56" height="10" rx="3"/>
    </g>
  </g>
  <!-- grass tufts in front of the fence base -->
  <g fill="#5a8738" transform="translate(0 46)">
    <path d="M0 830 Q40 790 70 830 Q110 800 140 832 Q190 795 230 834 Q280 805 320 836 Q370 800 420 836 Q470 806 520 834 Q570 798 620 836 Q670 806 720 834 Q770 800 820 836 Q870 806 920 834 Q970 798 1020 836 Q1070 806 1120 834 Q1170 800 1220 836 Q1270 806 1320 834 Q1370 798 1420 836 Q1470 806 1520 834 Q1560 802 1600 832 V1000 H0 Z"/>
  </g>
</svg>
