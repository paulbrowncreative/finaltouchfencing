[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Long-cache fingerprinted assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Old guide URLs moved to the blog
[[redirects]]
  from = "/resources/fence-permits-st-clair-shores-macomb-county/"
  to = "/blog/fence-permit-rules-macomb-county/"
  status = 301
[[redirects]]
  from = "/resources/preparing-for-fence-installation/"
  to = "/blog/how-to-prepare-for-fence-installation/"
  status = 301
[[redirects]]
  from = "/resources/wood-vs-vinyl-vs-aluminum-fence/"
  to = "/blog/wood-vs-vinyl-vs-aluminum-fence/"
  status = 301
[[redirects]]
  from = "/resources/*"
  to = "/blog/"
  status = 301

